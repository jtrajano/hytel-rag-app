# ============================================================================
# deploy-stage.yml - Staging Environment Deployment
# ============================================================================
# Deploys to the "stage" environment when code is pushed to the stage branch.
# Uses Workload Identity Federation (WIF) for secure, keyless authentication.
#
# Required GitHub Secrets:
#   - GCP_WORKLOAD_IDENTITY_PROVIDER: WIF provider path
#   - GCP_SA_EMAIL: Service account email
# ============================================================================

name: Deploy to Stage

# ============================================================================
# TRIGGERS
# ============================================================================
on:
  push:
    branches:
      - stage
  workflow_dispatch:

# ============================================================================
# ENVIRONMENT VARIABLES
# ============================================================================
env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'
  FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}

# ============================================================================
# CONCURRENCY
# ============================================================================
concurrency:
  group: deploy-stage
  cancel-in-progress: false

# ============================================================================
# JOBS
# ============================================================================
jobs:
  deploy:
    name: Build and Deploy to Stage
    runs-on: ubuntu-latest

    # ========================================================================
    # PERMISSIONS - Required for WIF
    # ========================================================================
    permissions:
      id-token: write
      contents: read

    # ========================================================================
    # ENVIRONMENT
    # ========================================================================
    environment:
      name: stage
      # TODO: Update with your staging URL
      url: https://stage.example.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

      # ======================================================================
      # WIF Authentication
      # ======================================================================
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      # ======================================================================
      # Deploy to Firebase
      # ======================================================================
      - name: Deploy to Firebase Hosting
        run: |
          npm install -g firebase-tools
          firebase deploy --project "$FIREBASE_PROJECT_ID" --only hosting

      - name: Prepare Functions Manifest for Firebase Build
        run: node scripts/prepare-functions-deploy-manifest.mjs

      - name: Sync OPENAQ_API_KEY to Secret Manager
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: |
          if [ -z "$OPENAQ_API_KEY" ]; then
            echo "::error::Missing required GitHub secret OPENAQ_API_KEY"
            exit 1
          fi
          if gcloud secrets describe OPENAQ_API_KEY --project "$FIREBASE_PROJECT_ID" >/dev/null 2>&1; then
            printf "%s" "$OPENAQ_API_KEY" | gcloud secrets versions add OPENAQ_API_KEY --project "$FIREBASE_PROJECT_ID" --data-file=-
          else
            printf "%s" "$OPENAQ_API_KEY" | gcloud secrets create OPENAQ_API_KEY --project "$FIREBASE_PROJECT_ID" --replication-policy=automatic --data-file=-
          fi

      - name: Deploy Firebase Functions
        run: firebase deploy --project "$FIREBASE_PROJECT_ID" --only functions
        continue-on-error: true

      - name: Deployment Summary
        run: |
          echo "## 🎭 Stage Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: stage" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by**: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
